    <!-- Fase 5 (aparência) — imagem de prévia ao compartilhar o link (ex.:
         WhatsApp, LinkedIn). Precisa ser URL ABSOLUTA (não "/og-image.png")
         porque quem lê essas tags é o servidor do WhatsApp/rede social
         buscando o link direto, sem executar nada do site — se o domínio
         mudar, atualizar aqui também. Vale pra TODO o site (é uma SPA sem
         geração de página por rota), mas a imagem foi montada em cima da
         página pública /produto de propósito, que é a que se compartilha
         de verdade com um cliente em potencial. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Normatiza — Controle de Documentos e Processos" />
    <meta property="og:description" content="Documentos e processos organizados, por setor, sem planilha nenhuma. Conheça o Normatiza." />
    <meta property="og:image" content="https://controle-de-documentos-acii.vercel.app/og-image.png" />
    <meta property="og:url" content="https://controle-de-documentos-acii.vercel.app/produto" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Normatiza — Controle de Documentos e Processos" />
    <meta name="twitter:description" content="Documentos e processos organizados, por setor, sem planilha nenhuma." />
    <meta name="twitter:image" content="https://controle-de-documentos-acii.vercel.app/og-image.png" />
    <script>
      // Fix for: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchValue = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchValue;
            },
            set: function(val) {
              fetchValue = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not patch window.fetch:", e);
        }
      })();
    </script>
